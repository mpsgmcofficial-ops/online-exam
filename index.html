<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>સુરક્ષિત ઓનલાઇન પરીક્ષા પોર્ટલ</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; margin: 0; padding: 15px; color: #1e293b; }
    .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; }
    .timer { font-size: 1.25rem; font-weight: bold; color: #dc2626; background: #fee2e2; padding: 8px 16px; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    .question-card { margin-bottom: 25px; padding: 18px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; }
    .question-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 12px; line-height: 1.5; }
    .options label { display: flex; align-items: center; margin: 10px 0; padding: 12px; background: #f8fafc; border-radius: 6px; cursor: pointer; border: 1px solid #e2e8f0; }
    .options label:hover { background: #e2e8f0; }
    .options input[type="radio"] { margin-right: 12px; transform: scale(1.2); }
    .btn { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; }
    .btn:hover { background: #1d4ed8; }
    
    /* મોડલ્સ અને ઓવરલે */
    .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; text-align: center; padding: 25px; }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- ૧. શરૂઆતનું GPS વેરિફિકેશન અને લોગિન મોડલ -->
  <div id="start-overlay" class="overlay">
    <h2 id="geo-status-title">સ્થળ (GPS Location) ચકાસી રહ્યા છીએ...</h2>
    <p id="geo-status-msg">કૃપા કરીને બ્રાઉઝરમાં Location Permission મંજૂર કરો.</p>
    
    <div id="login-box" style="display: none; max-width: 340px; width: 100%; margin-top: 20px;">
      <div class="form-group" style="text-align: left;">
        <label>વિદ્યાર્થીનું નામ:</label>
        <input type="text" id="stud-name" placeholder="પૂરું નામ લખો" required>
      </div>
      <div class="form-group" style="text-align: left;">
        <label>રોલ નંબર:</label>
        <input type="text" id="stud-roll" placeholder="રોલ નંબર લખો" required>
      </div>
      <button class="btn" onclick="startExam()">પરીક્ષા શરૂ કરો (Full Screen)</button>
    </div>
  </div>

  <!-- ૨. ઇન્વિજિલેટર અનલોક મોડલ (ટેબ સ્વિચ કે કોલ આવે ત્યારે) -->
  <div id="lockout-modal" class="overlay" style="display: none; background: rgba(15, 23, 42, 0.96);">
    <h2 style="color: #ef4444; font-size: 1.8rem; margin-bottom: 10px;">⚠️ પેપર લૉક કરવામાં આવ્યું છે</h2>
    <p id="lockout-reason" style="font-size: 1.1rem; color: #fca5a5;"></p>
    <p style="margin-top: 10px;">સુપરવાઇઝરને બોલાવો અને તેમનો પિન દાખલ કરાવો.</p>
    <div style="max-width: 280px; width: 100%; margin-top: 20px;">
      <input type="password" id="supervisor-pin" placeholder="સુપરવાઇઝર PIN" style="width: 100%; padding: 12px; font-size: 1.2rem; border-radius: 6px; border: none; text-align: center; margin-bottom: 12px;">
      <button class="btn" onclick="unlockExam()" style="background: #16a34a;">અનલોક કરો</button>
    </div>
  </div>

  <!-- ૩. મુખ્ય પરીક્ષા પેજ -->
  <div class="container" id="exam-box" style="display: none;">
    <div class="header">
      <div>
        <h3 id="display-student" style="margin: 0; color: #0f172a;"></h3>
        <small style="color: #64748b;">પરીક્ષા દરમિયાન સ્ક્રીન છોડવી નહીં</small>
      </div>
      <div class="timer" id="timer-display">સમય: 60:00</div>
    </div>

    <form id="quiz-form">
      <div id="questions-container"></div>
      <button type="button" class="btn" style="margin-top: 20px;" onclick="submitExam('વિદ્યાર્થી દ્વારા જાતે સબમિટ')">પેપર સબમિટ કરો</button>
    </form>
  </div>

  <script>
    // ========================================================
    // ૧. કસ્ટમ સેટિંગ્સ (તમારી જરૂરિયાત મુજબ અહીં ફેરફાર કરો)
    // ========================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxetmZuRO-EPY5ijpSl4WayEhH5Lxe3VPLaX06uW0hhuYwxZP4dNpvJXiVPC2176nHZ/exec";
    const TARGET_LAT = 22.488667;     // તમારા સેન્ટરનો અક્ષાંશ (Latitude)
    const TARGET_LON = 70.070596;     // તમારા સેન્ટરનો રેખાંશ (Longitude)
    const MAX_ALLOWED_DISTANCE = 150; // માન્ય અંતર (મીટરમાં)
    const EXAM_MINUTES = 60;        // પરીક્ષાનો સમય (મિનિટમાં)
    const SUPERVISOR_PIN = "9824";  // સુપરવાઇઝરનો અનલોક પિન
    const MAX_VIOLATIONS = 3;       // કેટલી વાર અનલોક થઈ શકે

    // ========================================================
    // ૨. સવાલોનું લિસ્ટ (અહીં તમારા પ્રશ્નો ઉમેરતા જાઓ)
    // ========================================================
    const rawQuestions = [
      {
        id: "q1",
        text: "ગુજરાતનું પાટનગર કયું છે?",
        options: { A: "અમદાવાદ", B: "ગાંધીનગર", C: "વડોદરા", D: "રાજકોટ" }
      },
      {
        id: "q2",
        text: "કમ્પ્યુટરનું મગજ કોને કહેવામાં આવે છે?",
        options: { A: "RAM", B: "CPU", C: "Hard Disk", D: "Monitor" }
      },
      {
        id: "q3",
        text: "ભારતનું રાષ્ટ્રીય ફૂલ કયું છે?",
        options: { A: "ગુલાબ", B: "સૂર્યમુખી", C: "કમળ", D: "મોગરો" }
      },
      {
        id: "q4",
        text: "HTML નું પૂરું નામ શું છે?",
        options: { A: "HighText Machine Language", B: "HyperText Markup Language", C: "Hyperlink Text Mode Language", D: "Hyper Tool Markup Language" }
      }
      // 👉 બાકીના પ્રશ્નો q5 થી q100 આ જ ફોર્મેટમાં અહીં પેસ્ટ કરો...
    ];

    // ગ્લોબલ વેરિએબલ્સ
    let timeLeft = EXAM_MINUTES * 60;
    let timerInterval = null;
    let isExamActive = false;
    let studentData = { name: "", roll: "" };
    let violationCount = 0;
    let initialWidth = window.innerWidth;
    let initialHeight = window.innerHeight;

    // GPS અંતર ગણતરી (Haversine Formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // લોકેશન ચકાસણી
    function verifyLocation() {
      if (!navigator.geolocation) {
        showGeoError("તમારા બ્રાઉઝરમાં GPS સપોર્ટ નથી.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const dist = calculateDistance(TARGET_LAT, TARGET_LON, pos.coords.latitude, pos.coords.longitude);
          if (dist <= MAX_ALLOWED_DISTANCE) {
            document.getElementById("geo-status-title").innerText = "સ્થળ ચકાસણી સફળ!";
            document.getElementById("geo-status-title").style.color = "#4ade80";
            document.getElementById("geo-status-msg").innerText = "તમે નિર્ધારિત કેમ્પસમાં હાજર છો. હવે વિગતો ભરો.";
            document.getElementById("login-box").style.display = "block";
          } else {
            showGeoError(`તમે પરીક્ષા કેન્દ્રની બહાર છો (અંદાજે ${Math.round(dist)} મીટર દૂર).`);
          }
        },
        () => showGeoError("GPS બંધ છે અથવા લોકેશન પરવાનગી નકારી છે. GPS ચાલુ કરો."),
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function showGeoError(msg) {
      const title = document.getElementById("geo-status-title");
      title.innerText = "પ્રવેશ પ્રતિબંધિત!";
      title.style.color = "#ef4444";
      document.getElementById("geo-status-msg").innerText = msg;
    }

    // સવાલો શફલ કરવા (દરેક વિદ્યાર્થીને અલગ ક્રમ મળશે)
    function shuffle(arr) {
      let copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // પેજ પર સવાલો ગોઠવવા
    function renderQuiz() {
      const shuffled = shuffle(rawQuestions);
      const container = document.getElementById("questions-container");
      container.innerHTML = shuffled.map((q, idx) => `
        <div class="question-card">
          <div class="question-title">${idx + 1}. ${q.text}</div>
          <div class="options">
            ${Object.entries(q.options).map(([k, val]) => `
              <label>
                <input type="radio" name="${q.id}" value="${k}">
                <strong>${k}.</strong>&nbsp;${val}
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // પરીક્ષા શરૂ કરવી
    function startExam() {
      const name = document.getElementById("stud-name").value.trim();
      const roll = document.getElementById("stud-roll").value.trim();
      if (!name || !roll) {
        alert("કૃપા કરીને નામ અને રોલ નંબર બંને લખો!");
        return;
      }
      studentData = { name, roll };
      document.getElementById("display-student").innerText = `${name} | રોલ નં: ${roll}`;

      // ફુલસ્ક્રીન કરવું
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      renderQuiz();
      document.getElementById("start-overlay").style.display = "none";
      document.getElementById("exam-box").style.display = "block";
      isExamActive = true;

      // ટાઈમર શરૂ
      timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById("timer-display").innerText = `સમય: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        if (timeLeft <= 0) submitExam("સમય પૂર્ણ થયો");
      }, 1000);
    }

    // જવાબો LocalStorage માં આપમેળે સેવ કરવા
    function saveAnswers() {
      const formData = new FormData(document.getElementById("quiz-form"));
      localStorage.setItem("exam_cache", JSON.stringify(Object.fromEntries(formData.entries())));
    }
    document.getElementById("quiz-form").addEventListener("change", saveAnswers);

    function restoreAnswers() {
      const cache = localStorage.getItem("exam_cache");
      if (!cache) return;
      const parsed = JSON.parse(cache);
      for (let [qId, val] of Object.entries(parsed)) {
        const rad = document.querySelector(`input[name="${qId}"][value="${val}"]`);
        if (rad) rad.checked = true;
      }
    }

    // ચીટિંગ ડિટેક્શન / નિયમ ભંગ હેન્ડલર
    function handleViolation(reason) {
      if (!isExamActive) return;
      violationCount++;
      saveAnswers();

      if (violationCount > MAX_VIOLATIONS) {
        alert("મહત્તમ ચેતવણી મર્યાદા પૂરી થઈ. તમારું પેપર જમા થઈ રહ્યું છે.");
        submitExam(`બહાર નીકળ્યા/લિમિટ પૂરી: ${reason}`);
        return;
      }

      isExamActive = false;
      document.getElementById("lockout-reason").innerText = `${reason} (ચેતવણી: ${violationCount}/${MAX_VIOLATIONS})`;
      document.getElementById("supervisor-pin").value = "";
      document.getElementById("lockout-modal").style.display = "flex";
    }

    // સુપરવાઈઝર PIN અનલોક
    function unlockExam() {
      if (document.getElementById("supervisor-pin").value === SUPERVISOR_PIN) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
        document.getElementById("lockout-modal").style.display = "none";
        isExamActive = true;
        restoreAnswers();
      } else {
        alert("ખોટો સુપરવાઇઝર પિન!");
      }
    }

    // સુરક્ષા ઇવેન્ટ્સ: ટેબ સ્વિચ, મિનિમાઇઝ, AI સ્પ્લિટ-સ્ક્રીન
    document.addEventListener("visibilitychange", () => {
      if (isExamActive && document.hidden) handleViolation("ટેબ સ્વિચ અથવા એપ મિનિમાઇઝ કરી");
    });
    window.addEventListener("blur", () => {
      if (isExamActive) handleViolation("વિન્ડો અનફોકસ થઈ (કોલ/નોટિફિકેશન/બીજી એપ)");
    });
    window.addEventListener("resize", () => {
      if (!isExamActive) return;
      if (Math.abs(window.innerWidth - initialWidth) > initialWidth * 0.25 || 
          Math.abs(window.innerHeight - initialHeight) > initialHeight * 0.25) {
        handleViolation("સ્પ્લિટ-સ્ક્રીન અથવા AI ફ્લોટિંગ વિન્ડો ખોલી");
      }
    });

    // કૉપી-પેસ્ટ અને શૉર્ટકટ્સ બ્લોક
    document.addEventListener("copy", (e) => { e.preventDefault(); if (isExamActive) handleViolation("પ્રશ્ન કૉપી કર્યો"); });
    document.addEventListener("paste", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      if (e.key === "PrintScreen" || e.keyCode === 44) {
        if (navigator.clipboard) navigator.clipboard.writeText("");
        handleViolation("સ્ક્રીનશોટ લેવાનો પ્રયાસ કર્યો");
      }
    });

    // પેપર સબમિશન
    function submitExam(reason) {
      if (!isExamActive && violationCount <= MAX_VIOLATIONS && reason === "વિદ્યાર્થી દ્વારા જાતે સબમિટ") return;
      isExamActive = false;
      clearInterval(timerInterval);

      document.body.innerHTML = `
        <div style="text-align:center; padding:50px; font-family:system-ui;">
          <h2>પેપર જમા થઈ રહ્યું છે... કૃપા કરીને પેજ બંધ કરશો નહીં.</h2>
        </div>
      `;

      const formData = new FormData(document.getElementById("quiz-form"));
      const answers = Object.fromEntries(formData.entries());

      const payload = {
        name: studentData.name,
        rollNo: studentData.roll,
        status: reason,
        violations: violationCount,
        answers: answers
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        localStorage.removeItem("exam_cache");
        document.body.innerHTML = `
          <div style="text-align:center; padding:50px; font-family:system-ui;">
            <h1 style="color:#16a34a;">પરીક્ષા પૂર્ણ થઈ ગઈ છે</h1>
            <p><strong>વિદ્યાર્થી:</strong> ${studentData.name} | <strong>રોલ:</strong> ${studentData.roll}</p>
            <p><strong>સબમિશન સ્ટેટસ:</strong> ${reason}</p>
            <p>તમારા જવાબો Google Sheet માં સેવ થઈ ગયા છે.</p>
          </div>
        `;
      }).catch((e) => {
        document.body.innerHTML = `<h3 style="color:red; text-align:center; padding:50px;">નેટવર્ક એરર: પેપર સબમિટ થઈ શક્યું નથી (${e.message})</h3>`;
      });
    }

    // પેજ ખૂલતાં જ લોકેશન ચેક
    window.onload = verifyLocation;
  </script>
</body>
</html>
